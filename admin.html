<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>阿憨植造 · 管理后台</title>
<style>
  :root {
    --brand: #4d7c52; --brand-dark: #3d6842; --brand-soft: #e9f2ea;
    --leaf: #6fae5e; --accent: #e0a458; --danger: #c2554a;
    --ink: #3b4038; --ink-soft: #8a9187; --line: #e2e0d6;
    --panel: #faf9f4; --canvas-bg: #edece4;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: #f4f2ea; color: var(--ink); }
  button { font-family: inherit; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer;
    transition: all .15s;
  }
  .btn:hover { border-color: var(--leaf); color: var(--brand); }
  .btn.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
  .btn.primary:hover { background: var(--brand-dark); }
  .btn.danger { color: var(--danger); border-color: #e8c9c4; }
  .btn.danger:hover { background: #fbf0ee; border-color: var(--danger); }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; height: 56px; background: var(--brand); color: #fff;
  }
  .topbar .brand { font-size: 17px; font-weight: 700; letter-spacing: 2px; display: flex; align-items: center; gap: 8px; }
  .topbar .right { display: flex; gap: 10px; align-items: center; }
  .topbar .btn { background: rgba(255,255,255,0.16); color: #fff; border: none; }
  .topbar .btn:hover { background: rgba(255,255,255,0.28); }

  .tabs { display: flex; gap: 0; background: #fff; border-bottom: 1px solid var(--line); padding: 0 20px; }
  .tab {
    padding: 13px 22px; font-size: 14px; color: var(--ink-soft); background: none;
    border: none; border-bottom: 2px solid transparent; cursor: pointer;
  }
  .tab.active { color: var(--brand); border-bottom-color: var(--brand); font-weight: 600; }

  .page { display: none; padding: 20px; max-width: 1200px; margin: 0 auto; }
  .page.active { display: block; }
  .sec { margin-bottom: 24px; }
  .sec-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; border-left: 3px solid var(--leaf); padding-left: 8px; }
  .empty-hint { color: var(--ink-soft); font-size: 13px; line-height: 1.9; }

  /* 分类管理 */
  .cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .cat-node { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: #fff; }
  .cat-node .row { display: flex; align-items: center; gap: 6px; }
  .cat-node .nm { flex: 1; font-size: 14px; font-weight: 600; }
  .mini-btn { border: 1px solid var(--line); background: #fff; border-radius: 5px; font-size: 11px; padding: 3px 8px; cursor: pointer; color: var(--ink-soft); }
  .mini-btn:hover { color: var(--brand); border-color: var(--leaf); }
  .mini-btn.danger:hover { color: var(--danger); border-color: var(--danger); }
  .sub-list { margin-top: 8px; padding-left: 10px; display: flex; flex-direction: column; gap: 6px; }
  .sub-row { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink); }
  .sub-row .nm { flex: 1; }
  .mgmt-add { margin-top: 14px; }
  .mgmt-btn { border: 1px dashed var(--line); background: #fff; color: var(--brand); border-radius: 8px; padding: 9px; font-size: 13px; cursor: pointer; width: 100%; }
  .mgmt-btn:hover { border-color: var(--leaf); background: var(--brand-soft); }

  /* 素材管理 */
  .upload-bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 10px; }
  .upload-bar input[type=file] { font-size: 13px; }
  .upload-bar label { font-size: 13px; color: var(--ink-soft); display: flex; align-items: center; gap: 5px; }
  .progress { font-size: 13px; color: var(--brand); margin: 6px 0; min-height: 18px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .toolbar select {
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 28px 8px 10px;
    font-size: 13px; background: #fff; color: var(--ink);
    appearance: none; -webkit-appearance: none; -moz-appearance: none;
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%23808a87' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat; background-position: right 10px center;
    cursor: pointer; min-width: 160px;
  }
  .toolbar select:focus { outline: none; border-color: var(--leaf); }
  .mat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
  .mat {
    border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px; text-align: center;
    cursor: pointer; position: relative;
  }
  .mat.sel { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-soft); }
  .mat img { width: 100%; height: 84px; object-fit: contain; }
  .mat .nm { font-size: 11px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 4px; }
  .mat .chk { position: absolute; top: 4px; right: 4px; width: 17px; height: 17px; border-radius: 50%; border: 1px solid var(--line); background: #fff; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #fff; }
  .mat.sel .chk { background: var(--brand); border-color: var(--brand); }

  /* 按父类→子类二级分组展示（连续网格流；父类全显示，子类默认最多 4 个 + 更多） */
  #mgmtMats { display: block; }
  .mat-group { margin-bottom: 18px; }
  .mat-group-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 600; color: var(--ink);
    margin: 2px 0 4px; padding: 6px 10px;
    background: var(--brand-soft); border-radius: 7px;
  }
  .mat-group-title .cnt { font-size: 11px; font-weight: 400; color: var(--ink-soft); }
  .mat-group-title .spacer { flex: 1; }
  .mgmt-more-mini {
    border: 1px solid rgba(77,124,82,.35); background: #fff; color: var(--brand);
    font-size: 11px; cursor: pointer; padding: 3px 10px; border-radius: 12px;
    white-space: nowrap; flex: none;
  }
  .mgmt-more-mini:hover { border-color: var(--leaf); background: var(--brand-soft); }
  /* 各大类下拉选择（替代一长排子类chip） */
  .mgmt-catbar { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 16px; }
  .cat-btn {
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 14px; padding: 4px 12px; font-size: 12px; cursor: pointer;
    max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .cat-btn:hover { border-color: var(--leaf); }
  .cat-btn.active { border-color: var(--leaf); background: var(--brand-soft); color: var(--brand); font-weight: 600; }
  .mgmt-drop {
    position: fixed; z-index: 80; background: #fff;
    border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.14);
    max-height: 280px; overflow: auto; min-width: 170px; padding: 6px;
  }
  .drop-opt {
    display: block; width: 100%; text-align: left; background: none; border: none;
    padding: 8px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; color: var(--ink);
  }
  .drop-opt:hover { background: var(--brand-soft); }
  .drop-opt.active { color: var(--brand); font-weight: 600; background: var(--brand-soft); }
  .mat-sub-title {
    display: flex; align-items: baseline; gap: 8px;
    font-size: 12px; font-weight: 600; color: var(--ink);
    margin: 8px 0 8px; padding: 4px 10px 4px 12px;
    border-left: 2px solid var(--line); color: var(--ink-soft);
  }
  .mat-sub-title .cnt { font-size: 11px; font-weight: 400; color: var(--ink-soft); }
  .mat-group:last-child { margin-bottom: 4px; }

  /* 质检标记 */
  .mat.flag-redo { border-color: #e0a458; box-shadow: 0 0 0 1px #e0a458; }
  .mat.flag-bad { border-color: #c2554a; box-shadow: 0 0 0 1px #c2554a; }
  .mat .flag-dot { position: absolute; top: 4px; left: 4px; width: 9px; height: 9px; border-radius: 50%; border: 1px solid rgba(0,0,0,.15); }
  .mat .flag-dot.redo { background: #e0a458; }
  .mat .flag-dot.bad { background: #c2554a; }
  .mat .flag-btns { display: flex; gap: 4px; margin-top: 5px; }
  .mat .flag-btns button {
    flex: 1; font-size: 10px; padding: 2px 0; border-radius: 4px;
    border: 1px solid var(--line); background: #fff; color: var(--ink-soft); cursor: pointer;
  }
  .mat .flag-btns button:hover { color: var(--brand); border-color: var(--leaf); }
  .mat .flag-btns button.on-redo { background: #fdf3e3; color: #b57a1e; border-color: #e0a458; }
  .mat .flag-btns button.on-bad { background: #fbf0ee; color: #c2554a; border-color: #c2554a; }
  .flag-hint { font-size: 12px; color: var(--ink-soft); margin: 6px 0 0; line-height: 1.8; }
  .flag-hint b { color: var(--ink); }
  /* 客户反馈 */
  .mat .fbk-badge {
    position: absolute; top: 4px; left: 17px; background: #e87a5d; color: #fff;
    font-size: 9px; line-height: 14px; padding: 0 5px; border-radius: 8px; cursor: pointer;
  }
  .mat .fbk-badge:hover { background: #d5634a; }
  .fbk-dlg { position: fixed; inset: 0; z-index: 200; background: rgba(43,58,46,.55); display: flex; align-items: center; justify-content: center; }
  .fbk-card { background: #fff; border-radius: 12px; padding: 20px; width: min(92vw, 380px); max-height: 78vh; overflow: auto; }
  .fbk-card h4 { font-size: 15px; color: var(--ink); margin-bottom: 10px; }
  .fbk-item { border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; margin-bottom: 8px; }
  .fbk-item .who { font-size: 11px; color: var(--ink-soft); margin-bottom: 3px; }
  .fbk-item .type-tag { display: inline-block; font-size: 10px; background: var(--brand-soft); color: var(--brand); border-radius: 8px; padding: 1px 7px; margin-right: 5px; }
  .fbk-item .note { font-size: 13px; color: var(--ink); line-height: 1.6; }
  .fbk-empty { font-size: 13px; color: var(--ink-soft); padding: 14px 0; text-align: center; }

  /* 素材快速导航（chips 横向滚动） */
  .mgmt-search-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
  .mgmt-search-row input {
    flex: 1; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px;
    font-size: 13px; background: #fff; color: var(--ink); outline: none;
  }
  .mgmt-search-row input:focus { border-color: var(--leaf); }
  .chips {
    display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 10px;
    -webkit-overflow-scrolling: touch; scrollbar-width: thin;
  }
  .chips::-webkit-scrollbar { height: 5px; }
  .chips::-webkit-scrollbar-thumb { background: #d8d5c8; border-radius: 3px; }
  .chip {
    flex: 0 0 auto; border: 1px solid var(--line); background: #fff; color: var(--ink-soft);
    border-radius: 15px; padding: 5px 13px; font-size: 12px; cursor: pointer; white-space: nowrap;
    transition: all .12s;
  }
  .chip:hover { color: var(--brand); border-color: var(--leaf); }
  .chip.on { background: var(--brand); color: #fff; border-color: var(--brand); font-weight: 600; }
  .chip.warn.on { background: #b57a1e; border-color: #b57a1e; }
  .chip.danger.on { background: var(--danger); border-color: var(--danger); }

  /* 大图预览 lightbox */
  .preview-dlg {
    position: fixed; inset: 0; z-index: 300; background: rgba(20,25,20,.88);
    display: flex; align-items: center; justify-content: center;
  }
  .preview-stage { position: relative; max-width: 92vw; max-height: 88vh; display: flex; flex-direction: column; align-items: center; }
  .preview-stage img { max-width: 92vw; max-height: 80vh; object-fit: contain; border-radius: 6px; background: repeating-conic-gradient(#e8e6dc 0% 25%, #f6f5ef 0% 50%) 0 0/20px 20px; }
  .preview-meta { color: rgba(255,255,255,.92); font-size: 13px; margin-top: 10px; text-align: center; }
  .preview-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(255,255,255,.18); color: #fff; font-size: 18px; display: flex; align-items: center; justify-content: center;
  }
  .preview-nav:hover { background: rgba(255,255,255,.32); }
  .preview-nav.prev { left: -58px; }
  .preview-nav.next { right: -58px; }
  .preview-close {
    position: absolute; top: -44px; right: 0; width: 34px; height: 34px; border-radius: 50%;
    border: none; cursor: pointer; background: rgba(255,255,255,.18); color: #fff; font-size: 15px;
  }
  .preview-close:hover { background: rgba(255,255,255,.32); }

  /* 用户管理 */
  .user-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; }
  .user-table th, .user-table td { padding: 10px 14px; text-align: left; font-size: 13px; border-bottom: 1px solid var(--line); }
  .user-table th { background: #f6f4ec; font-weight: 600; }
  .user-table .role-tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; }
  .role-tag.admin { background: #fdf3e3; color: #b57a1e; }
  .role-tag.member { background: var(--brand-soft); color: var(--brand); }
  .ops { display: flex; gap: 6px; }
  .ops .btn { padding: 5px 10px; font-size: 12px; }

  .auth-gate {
    position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, rgba(43,58,46,0.9), rgba(30,42,34,0.94));
  }
  .auth-card { background: #fff; border-radius: 14px; padding: 30px 28px; text-align: center; max-width: 340px; width: 88vw; box-shadow: 0 18px 48px rgba(20,30,22,.35); }
  .auth-card h3 { margin-bottom: 6px; color: var(--brand); font-size: 18px; }
  .auth-card p { font-size: 13px; color: var(--ink-soft); margin-bottom: 14px; line-height: 1.8; }
  .auth-form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
  .auth-form input {
    border: 1px solid var(--line); border-radius: 8px; padding: 11px 13px;
    font-size: 14px; outline: none; background: #faf9f4; color: var(--ink);
  }
  .auth-form input:focus { border-color: var(--leaf); background: #fff; }
  .auth-card .btn { width: 100%; padding: 11px; font-size: 14px; }
  .auth-hint { font-size: 12px; color: var(--ink-soft); margin-top: 12px; }
</style>
</head>
<body>

<div class="topbar" id="topbar" style="display:none">
  <div class="brand">🦋 阿憨植造 · 管理后台</div>
  <div class="right">
    <span id="adminName" style="font-size:13px;opacity:.9"></span>
    <button class="btn" id="btnBack">返回设计器</button>
    <button class="btn" id="btnLogout">退出</button>
  </div>
</div>

<div class="tabs" id="tabs" style="display:none">
  <button class="tab active" data-page="mats">素材管理</button>
  <button class="tab" data-page="cats">分类管理</button>
  <button class="tab" data-page="users">用户管理</button>
</div>

<!-- 分类管理 -->
<div class="page" id="page-cats">
  <div class="sec">
    <div class="sec-title">分类管理（父类 → 子类）</div>
    <div class="cat-grid" id="mgmtCats"></div>
    <div class="mgmt-add"><button class="mgmt-btn" id="mgmtAddCat">＋ 添加父类</button></div>
    <div style="margin-top:10px;font-size:12px;color:var(--ink-soft)">提示：删除分类时，其下素材会自动回到「未分类」；素材库（客户端）的分类与此处完全一致。</div>
  </div>
</div>

<!-- 素材管理（默认首页） -->
<div class="page active" id="page-mats">
  <div class="sec">
    <div class="sec-title">批量上传素材</div>
    <div class="upload-bar">
      <input type="file" id="mgmtFiles" multiple accept="image/png,image/jpeg">
      <label><input type="checkbox" id="mgmtAutoBG" checked> 自动去白底</label>
      <button class="btn primary" id="mgmtUpload">上传选中图片（先入「未分类」）</button>
    </div>
    <div class="progress" id="mgmtProgress"></div>
  </div>
  <div class="sec">
    <div class="sec-title">素材管理</div>
    <div class="mgmt-search-row">
      <input id="mgmtSearch" placeholder="🔍 搜索素材（名称 / 父类 / 子类，全类目）">
    </div>
    <div class="chips" id="mgmtChips"></div>
    <div class="mgmt-catbar" id="mgmtCatbar"></div>
    <div class="mgmt-drop" id="mgmtDrop"></div>
    <div class="toolbar">
      <select id="mgmtMoveTo"></select>
      <button class="btn" id="mgmtCategorize">归类到所选</button>
      <button class="btn" id="mgmtRename">改名</button>
      <button class="btn" id="mgmtReplace">替换图片</button>
      <button class="btn" id="mgmtExport">导出标记清单</button>
      <button class="btn danger" id="mgmtDelete">删除所选</button>
    </div>
    <div class="flag-hint">点击素材图可<b>放大预览</b>（←/→ 切换同列表素材）；卡片底部<b>「重做」「残次」</b>一键标记；标记素材在客户端自动隐藏。</div>
    <div id="mgmtMats"></div>
  </div>
</div>

<!-- 用户管理 -->
<div class="page" id="page-users">
  <div class="sec">
    <div class="sec-title">用户管理</div>
    <table class="user-table">
      <thead><tr><th>用户名</th><th>角色</th><th>注册时间</th><th>操作</th></tr></thead>
      <tbody id="userList"></tbody>
    </table>
    <div style="margin-top:10px;font-size:12px;color:var(--ink-soft)">提示：此处管理的是<b>前端普通用户</b>（设计器注册用户）；管理员账号在独立体系 admins.json 中，不在此列表。删除用户会同时删除其云端方案。</div>
  </div>
</div>

<!-- 管理员登录校验遮罩（独立登录，不跳转设计器） -->
<div class="auth-gate" id="authGate">
  <div class="auth-card">
    <h3>🦋 阿憨植造 · 管理后台</h3>
    <p id="gateMsg">请使用管理员账号登录</p>
    <div class="auth-form">
      <input id="adminUser" placeholder="管理员账号" autocomplete="username">
      <input id="adminPass" type="password" placeholder="密码" autocomplete="current-password">
    </div>
    <button class="btn primary" id="btnAdminLogin">登 录</button>
    <p class="auth-hint">管理员账号与前端用户相互独立：<br>管理员可登录后台与设计器；普通用户无法进入后台。</p>
  </div>
